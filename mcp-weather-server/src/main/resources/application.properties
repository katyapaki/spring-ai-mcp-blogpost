# spring.main.web-application-type=none

# NOTE: You must disable the banner and the console logging 
# to allow the STDIO transport to work !!!
spring.main.banner-mode=off
# logging.pattern.console=

# spring.ai.mcp.server.stdio=false

spring.ai.mcp.server.name=mcp-weather-server
spring.ai.mcp.server.request-timeout=1h

spring.ai.mcp.server.protocol=STREAMABLE

spring.ai.mcp.server.port=8080

logging.file.name=./target/server.log

# Optional: enable MCP sampling callback to client (can block with tools that advertise
# sampling but do not implement createMessage handling, such as some inspector flows).
weather.sampling.enabled=true
logging.level.org.springframework.ai.mcp.sample.server=DEBUG

# Weather provider settings
weather.api.url=https://wttr.in/{latitude},{longitude}?format=j1
weather.api.connect-timeout-ms=3000
weather.api.read-timeout-ms=5000
